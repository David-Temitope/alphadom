<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-VLVEbKOhqSrIzu+ixx91uxMMUSSj+qFhG8Yc55jmgKM=' https://js.paystack.co 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; frame-src https://checkout.paystack.com; base-uri 'self'; form-action 'self';"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Alphadom — Buy & Sell Products Online in Nigeria | Trusted Marketplace</title>
    <meta
      name="description"
      content="Alphadom is Nigeria's #1 trusted online marketplace. Buy affordable fashion, electronics, phones, laptops, books & essentials from verified vendors with fast nationwide delivery."
    />
    <meta name="keywords" content="Alphadom, buy online Nigeria, online shopping Nigeria, cheap phones Nigeria, buy clothes online, electronics Nigeria, affordable fashion, trusted vendors, nationwide delivery, e-commerce Nigeria, online marketplace, buy laptops Nigeria, shoes online Nigeria, best deals Nigeria, buy and sell online Nigeria" />
    <meta name="author" content="Alphadom" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://alphadom.online" />

    <!-- Theme -->
    <meta name="theme-color" content="#16a34a" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:locale" content="en_NG" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alphadom — Buy & Sell Products Online in Nigeria" />
    <meta property="og:description" content="Nigeria's trusted online marketplace. Affordable products from verified vendors with fast nationwide delivery." />
    <meta property="og:url" content="https://alphadom.online" />
    <meta property="og:site_name" content="Alphadom" />
    <meta property="og:image" content="https://alphadom.online/favicon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alphadom — Buy & Sell Products Online in Nigeria" />
    <meta name="twitter:description" content="Nigeria's trusted marketplace. Buy affordable fashion, electronics & more from verified vendors." />
    <meta name="twitter:image" content="https://alphadom.online/favicon.png" />

    <!-- Structured Data: Organization + WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Alphadom",
          "url": "https://alphadom.online",
          "logo": "https://alphadom.online/favicon.png",
          "description": "Nigeria's trusted online marketplace for affordable products from verified vendors.",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "NG"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "url": "https://alphadom.online/contact"
          }
        },
        {
          "@type": "WebSite",
          "name": "Alphadom",
          "url": "https://alphadom.online",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://alphadom.online/products?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <!-- Paystack loaded dynamically with SRI in components that need it -->
  </body>
</html>
